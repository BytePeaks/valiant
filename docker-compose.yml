version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: valiant-db
    environment:
      POSTGRES_USER: valiant
      POSTGRES_PASSWORD: valiant_password
      POSTGRES_DB: valiant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: valiant-backend
    restart: always
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://valiant:valiant_password@postgres:5432/valiant?sslmode=disable
    ports:
      - "8080:8080"
    volumes:
      - ./example/config.yaml:/app/config.yaml
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: valiant-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
