apiVersion: v1
kind: Secret
metadata:
  name: {{ include "valiant.fullname" . }}-db-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "valiant.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "valiant.databaseUrl" . | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  {{- end }}
