apiVersion: v1
kind: Service
metadata:
  name: {{ include "valiant.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "valiant.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    {{- include "valiant.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
