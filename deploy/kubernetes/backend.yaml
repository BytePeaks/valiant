apiVersion: apps/v1
kind: Deployment
metadata:
  name: valiant-backend
  namespace: valiant
  labels:
    app.kubernetes.io/name: valiant-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: valiant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valiant-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valiant-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: valiant
    spec:
      serviceAccountName: valiant-backend
      containers:
        - name: backend
          image: ghcr.io/bytepeaks/valiant-backend:1.0.0-alpha
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: valiant-db-credentials
                  key: DATABASE_URL
          volumeMounts:
            - name: config
              mountPath: /root/config.yaml
              subPath: config.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: valiant-config
---
apiVersion: v1
kind: Service
metadata:
  name: valiant-backend
  namespace: valiant
  labels:
    app.kubernetes.io/name: valiant-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: valiant
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: valiant-backend
