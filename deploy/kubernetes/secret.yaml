apiVersion: v1
kind: Secret
metadata:
  name: valiant-db-credentials
  namespace: valiant
  labels:
    app.kubernetes.io/name: valiant-db-credentials
    app.kubernetes.io/part-of: valiant
type: Opaque
stringData:
  # Replace with your actual PostgreSQL connection string
  DATABASE_URL: "postgres://valiant:CHANGE_ME@postgres.valiant.svc.cluster.local:5432/valiant?sslmode=disable"
