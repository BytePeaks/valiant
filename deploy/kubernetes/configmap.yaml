apiVersion: v1
kind: ConfigMap
metadata:
  name: valiant-config
  namespace: valiant
  labels:
    app.kubernetes.io/name: valiant-config
    app.kubernetes.io/part-of: valiant
data:
  config.yaml: |
    port: "8080"

    prometheus:
      url: "http://prometheus.monitoring.svc.cluster.local:9090"

    kubernetes:
      enabled: true
      kube_config_path: ""
      namespaces: []
      require_annotation: false
      watch_configmaps: true
      watch_secrets: true

    retention:
      event_ttl: "90d"
      cleanup_interval: "1h"

    analysis:
      baseline_window: "30m"
      post_execution_impact_window: "30m"
      intent_execution_correlation_window: "1h"
