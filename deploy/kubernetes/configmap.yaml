apiVersion: v1
kind: ConfigMap
metadata:
  name: valiant-config
  namespace: valiant
  labels:
    app.kubernetes.io/name: valiant-config
    app.kubernetes.io/part-of: valiant
data:
  config.yaml: |
    database_url: "postgres://valiant:changeme@postgres.valiant.svc.cluster.local:5432/valiant?sslmode=disable"
    port: "8080"
    prometheus:
      url: "http://prometheus.monitoring.svc.cluster.local:9090"
      # queries:
      #   error_rate: `avg_over_time(...)`
      additional_metrics: []
    kubernetes:
      enabled: true
      kube_config_path: ""
      namespaces: []
      require_annotation: false
      allowed_sources: ["argocd", "helm", "cicd"]
      watch_configmaps: true
      watch_secrets: true
    retention:
      event_ttl: "90d"
      cleanup_interval: "1h"
    analysis:
      baseline_window: "30m"
      post_execution_impact_window: "30m"
      intent_execution_correlation_window: "1h"
      config_trigger_window: "15m"
      # weights_built_in:
      #   error_rate: 0.4
      #   latency_p95_ms: 0.3
      #   cpu: 0.1
      #   memory: 0.1
      #   rps: 0.1
      weights_custom: {}
    linking: []
    worker:
      polling_interval: "5m"
