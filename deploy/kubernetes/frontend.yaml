apiVersion: apps/v1
kind: Deployment
metadata:
  name: valiant-frontend
  namespace: valiant
  labels:
    app.kubernetes.io/name: valiant-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: valiant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valiant-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valiant-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: valiant
    spec:
      containers:
        - name: frontend
          image: ghcr.io/bytepeaks/valiant-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://valiant-backend.valiant.svc.cluster.local:8080/api/v1"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: valiant-frontend
  namespace: valiant
  labels:
    app.kubernetes.io/name: valiant-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: valiant
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: valiant-frontend
